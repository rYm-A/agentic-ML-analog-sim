experiment_name: "un0_kuramoto_analog_acceleration"

reference_design:
  name: "cifar10/n1024"
  family: "cifar10"
  n_oscillators: 1024
  n_conditional_oscillators: 8
  solver: "rk4"
  num_steps: 25
  integration_time: 1.0
  precision: "fp32"
  noise_model: "none"
  sparsity_ratio: 0.0

solvers:
  euler:
    steps: [1, 2, 5, 10]
  rk4:
    steps: [5, 10, 15, 25]
  euler_backward:
    steps: [2, 5, 10]
  parareal:
    steps: [10, 20]
  par_ode:
    steps: [10, 25]

noise_models:
  - "L0_static_mismatch"
  - "L1_stochastic_parameter_noise"
  - "L2_functional_interface"
  - "L3_correlated_drift"

sparsity_configs:
  dense:
    sparsity_ratio: 0.0
  threshold_pruned:
    allowed_sparsity_ratios: [0.2, 0.4, 0.6, 0.8]
  degree_bounded:
    max_degree: [64, 128, 256]

tolerances:
  compile_check:
    rtol: 1e-4
    atol: 1e-4
  solver_accuracy:
    rtol: 5e-2
    atol: 5e-2
    max_fid_degradation: 2.0

budget:
  max_experiments: 10
  max_iterations: 15
  max_node_retries: 3
  timeout_seconds_per_eval: 300

counter_limits:
  max_counter_1_compilation: 3
  max_counter_2_rewrite: 3
  max_counter_3_debug_gate: 3
  max_counter_4_debug_loop: 5

agent_efforts:
  node2_phase0_propose_candidate:
    model: "gemini-2.5-pro"
    effort: "high"
  node1_phase1_solver_rewriter:
    model: "gemini-2.5-pro"
    effort: "high"
  node2_phase1_noise_rewriter:
    model: "gemini-2.5-pro"
    effort: "high"
  node3_phase1_compiler_rewriter:
    model: "gemini-2.5-pro"
    effort: "high"
  node8_phase1_diagnostic_proposal:
    model: "gemini-2.5-flash"
    effort: "medium"
  node2_phase2_generate_final_report:
    model: "gemini-2.5-flash"
    effort: "medium"
