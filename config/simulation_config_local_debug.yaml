experiment_name: "un0_kuramoto_analog_acceleration"
device: mps

reference_design:
  name: "imagenet64/n6656"
  family: "imagenet64"
  n_oscillators: 6656
  n_conditional_oscillators: 1
  solver: "rk4"
  num_steps: 60
  integration_time: 1.0
  precision: "fp32"
  noise_model: "none"
  sparsity_ratio: 0.0
  num_classes: 1000

solvers:
  rk4:
    steps: [5, 10, 15, 25, 35]
  euler_backward:
    steps: [2, 5, 10, 25, 35]
  parareal:
    steps: [2, 10, 20, 25, 35]
  par_ode:
    steps: [2, 10, 20, 25, 35]

noise_models:
  - "L0_static_mismatch"
  - "L1_stochastic_parameter_noise"

sparsity_configs:
  dense:
    sparsity_ratio: 0.0
  threshold_pruned:
    allowed_sparsity_ratios: [0.0]
  degree_bounded:
    max_degree: [64]

tolerances:
  compile_check:
    rtol: 1e-4
    atol: 1e-4
  solver_accuracy:
    rtol: .inf
    atol: .inf
    max_fid_degradation: 2.0

budget:
  max_experiments: 7
  max_iterations: 22
  max_node_retries: 3
  timeout_seconds_per_eval: 300

counter_limits:
  max_counter_1_compilation: 3
  max_counter_2_rewrite: 3
  max_counter_3_debug_gate: 3
  max_counter_4_debug_loop: 4

agent_efforts:
  node2_phase0_propose_candidate:
    model: "gemini-3.8-flash"
    effort: "medium"
  node1_phase1_solver_rewriter:
    model: "gemini-3.8-flash"
    effort: "high"
  node2_phase1_noise_rewriter:
    model: "gemini-3.8-flash"
    effort: "high"
  node3_phase1_compiler_rewriter:
    model: "gemini-3.8-flash"
    effort: "high"
  node8_phase1_diagnostic_proposal:
    model: "gemini-3.8-flash"
    effort: "medium"
  node2_phase2_generate_final_report:
    model: "gemini-3.8-flash"
    effort: "medium"
