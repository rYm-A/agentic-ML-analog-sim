# Cloud Burst Profile for Phase 2 GPU Simulation Pool (Tailnet + GCP)
cluster_name: "agentic-ml-analog-sim-cloud"

tailnet:
  manage_all: true
  auth_key: ${TS_AUTHKEY}

provider:
  head_ip: ${THIS_MACHINE}

auth:
  ssh_user: ${USER}
  ssh_private_key: "~/.ssh/id_ed25519"

head_env_commands:
  - "source ~/.zshrc && conda activate chia_env"

head_setup_commands:
  - "source ~/.zshrc && conda activate chia_env"

head_start_ray_commands:
  - "source ~/.zshrc && conda activate chia_env && ray stop"
  - "source ~/.zshrc && conda activate chia_env && ray start --head --port=6379 --node-ip-address=${THIS_MACHINE} --resources='{\"antigravity_creds\": 1, \"metal_gpu\": 1, \"sqlite_db\": 1, \"python_worker\": 4}' --include-dashboard=False"

worker_start_ray_commands:
  - "ray stop"
  - "ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0"

gcp_nodes:
  project: ${GCP_PROJECT}
  zone: "us-central1-a"
  sim_gpu_pool:
    machine_type: "g2-standard-8"
    count: 2
    spot: true
    ssh_user: "chia"
    ssh_private_key: "${HOME}/.ssh/id_ed25519"

available_node_types:
  local_orchestrator:
    resources: {"antigravity_creds": 1, "sqlite_db": 1}
    num_workers: 1
    compatible_ips: ["${THIS_MACHINE}"]
    worker_env_commands:
      - "source ~/.zshrc && conda activate chia_env"

  gpu_simulation_worker:
    resources: {"nvidia_gpu": 1, "sim_worker": 1}
    num_workers: 2
    compatible_ips: ["@sim_gpu_pool:0", "@sim_gpu_pool:1"]
    worker_env_commands:
      - "source ~/.bashrc && conda activate chia_env"
